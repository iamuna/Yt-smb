name: Validate Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure FFmpeg
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }
          ffmpeg -version
          ffprobe -version

      - name: Compile Python sources
        run: python -m compileall -q app.py shorts_factory tests tools

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Render a real demo Short
        run: python tests/render_smoke.py

      - name: Render continuous CCTV footage demo
        run: python tools/make_real_cctv_demo.py

      - name: Upload rendered demos
        uses: actions/upload-artifact@v4
        with:
          name: yt-smb-demos
          path: |
            artifacts/yt-smb-demo.mp4
            artifacts/yt-smb-demo-metadata.json
            artifacts/real-moving-cctv-parking-lot.mp4
            artifacts/real-moving-cctv-parking-lot-metadata.json
          if-no-files-found: error
          retention-days: 14
